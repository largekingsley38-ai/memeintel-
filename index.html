<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemeIntel MARKETCAP - Lightning Trading</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c14;color:#e0e8f0;font-family:monospace;height:100vh;overflow:hidden}
.nav{background:#060a10;border-bottom:2px solid #00e676;padding:10px;height:44px;display:flex;align-items:center;justify-content:space-between;z-index:100}
.logo{color:#00e676;font-size:13px;font-weight:900;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
.nav-btns{display:flex;gap:6px}
.nav-btn{padding:6px 12px;background:#00e67620;border:2px solid #00e676;color:#00e676;border-radius:4px;font-size:9px;cursor:pointer;font-weight:700;transition:all 0.1s}
.nav-btn:hover{background:#00e67650;transform:scale(1.05)}
.nav-btn.active{background:#00e67650}
.main{display:flex;height:calc(100vh - 44px);overflow:hidden;gap:4px;padding:4px}
.left{width:15%;background:#0a0f1a;border:1px solid #00e67630;overflow-y:auto;padding:8px;border-radius:4px}
.search{width:100%;padding:8px;background:#0b1220;border:1px solid #00e67650;color:#fff;border-radius:4px;font-size:9px;margin-bottom:8px;font-family:monospace}
.tok{padding:6px;cursor:pointer;border-radius:3px;margin-bottom:2px;transition:all 0.1s;display:none;border-left:2px solid transparent}
.tok.show{display:block}
.tok:hover{background:#00e67610;border-left-color:#00e676}
.tok.sel{background:#00e67630;border-left-color:#00e676}
.center{flex:1;background:#0c1120;border:1px solid #00e67630;display:flex;flex-direction:column;border-radius:4px;overflow:hidden}
.topbar{background:#060a10;padding:8px;border-bottom:1px solid #00e67630;display:flex;justify-content:space-between;align-items:center;font-size:9px}
.price-display{display:flex;gap:12px}
.price-item{display:flex;flex-direction:column}
.price-label{color:#ffffff40;font-size:7px}
.price-val{color:#00e676;font-weight:900;font-size:11px}
.tabs{display:flex;gap:2px;padding:6px;background:#060a10;border-bottom:1px solid #00e67630;overflow-x:auto}
.tab{flex:1;min-width:55px;padding:6px;border:1px solid #00e67630;background:none;color:#ffffff50;font-size:9px;cursor:pointer;transition:all 0.1s;border-radius:3px;white-space:nowrap}
.tab.on{background:#00e67630;color:#00e676;border-color:#00e676}
.content{flex:1;overflow-y:auto;padding:8px}
.card{background:#0b1220;border:1px solid #00e67630;padding:8px;margin-bottom:6px;border-radius:4px}
.chart{display:flex;align-items:flex-end;gap:1px;height:100%;min-height:300px}
.bar{flex:1;border-radius:1px}
.right{width:20%;background:#0a0f1a;border:1px solid #00e67630;overflow-y:auto;padding:8px;border-radius:4px;display:flex;flex-direction:column}
.sec{border-bottom:1px solid #00e67630;padding:8px 0;font-size:8px}
.sec-title{color:#00e676;font-weight:900;letter-spacing:2px;margin-bottom:6px;text-transform:uppercase;font-size:7px}
.mc-display{background:linear-gradient(135deg,#00e67620,#0b1220);border:2px solid #00e676;border-radius:6px;padding:12px;margin:6px 0;text-align:center}
.mc-label{color:#ffffff40;font-size:7px;text-transform:uppercase}
.mc-value{color:#00e676;font-size:16px;font-weight:900;font-family:'Courier New';margin:6px 0}
.mc-progress{background:#0b1220;border:1px solid #00e67650;border-radius:3px;height:6px;overflow:hidden;margin:8px 0}
.mc-bar{background:linear-gradient(90deg,#00e676,#00b85e);height:100%;transition:width 0.5s;border-radius:3px}
.trigger{background:#0b1220;border-left:3px solid #00e676;padding:8px;margin-bottom:6px;border-radius:3px}
.trigger-label{color:#00e676;font-weight:900;font-size:9px;margin-bottom:4px}
.trigger-input{width:100%;padding:6px;background:#080c14;border:1px solid #00e67650;color:#fff;border-radius:3px;font-size:9px;margin-bottom:6px;font-family:monospace}
.trigger-status{display:flex;justify-content:space-between;align-items:center;font-size:8px;color:#ffffff60}
.trigger-status.active{color:#00e676}
.quick-buy{background:linear-gradient(135deg,#00e676,#00b85e);color:#000;border:none;border-radius:4px;padding:10px;font-size:10px;font-weight:900;cursor:pointer;width:100%;margin:6px 0;transition:all 0.1s;font-family:monospace}
.quick-buy:hover{transform:scale(1.02);box-shadow:0 0 20px #00e67650}
.quick-exit{background:linear-gradient(135deg,#ff1744,#cc1036);color:#fff;border:none;border-radius:4px;padding:10px;font-size:10px;font-weight:900;cursor:pointer;width:100%;transition:all 0.1s;font-family:monospace}
.quick-exit:hover{transform:scale(1.02);box-shadow:0 0 20px #ff174450}
.notif{position:fixed;bottom:20px;right:20px;background:#0b1220;border:2px solid #00e676;border-radius:8px;padding:12px;max-width:320px;z-index:999;animation:slideInRight 0.3s;box-shadow:0 0 20px #00e67650}
@keyframes slideInRight{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
.notif.buy{border-color:#00e676}
.notif.sell{border-color:#ff1744}
.input-group{margin-bottom:8px}
.input-group input{width:100%;padding:6px;background:#0b1220;border:1px solid #00e67650;color:#fff;border-radius:3px;font-size:9px;font-family:monospace}
.btn{width:100%;padding:6px;background:#00e67620;border:1px solid #00e67650;color:#00e676;border-radius:3px;font-size:9px;font-weight:700;cursor:pointer;transition:all 0.1s}
.btn:hover{background:#00e67650}
</style>
</head>
<body>

<div class="nav">
<div class="logo">⚡ MEMEINTEL MARKETCAP</div>
<div class="nav-btns">
<button class="nav-btn active" onclick="showSection('trading')">⚡ TRADE</button>
<button class="nav-btn" onclick="showSection('triggers')">🎯 TRIGGERS</button>
<button class="nav-btn" onclick="showSection('history')">📊 HIST</button>
<button class="nav-btn" onclick="showSection('portfolio')">💼 PORT</button>
</div>
</div>

<div class="main" id="tradingSection">
<div class="left">
<input type="text" class="search" id="search" placeholder="🔍 Search..." onkeyup="filterTokens()">
<div id="tokList" style="flex:1;overflow-y:auto"></div>
</div>

<div class="center">
<div class="topbar">
<div id="topbar">Select token</div>
<div class="price-display">
<div class="price-item">
<div class="price-label">PRICE</div>
<div class="price-val" id="price">$0</div>
</div>
<div class="price-item">
<div class="price-label">MC</div>
<div class="price-val" id="mc">$0</div>
</div>
<div class="price-item">
<div class="price-label">24H</div>
<div class="price-val" id="change">+0%</div>
</div>
</div>
</div>
<div class="tabs">
<button class="tab on" onclick="showView(0)">📊 Chart</button>
<button class="tab" onclick="showView(1)">🎯 Triggers</button>
<button class="tab" onclick="showView(2)">💰 Top</button>
</div>
<div class="content" id="content"></div>
</div>

<div class="right">
<div class="sec" style="flex:1">
<div class="sec-title">💎 Market Cap</div>
<div class="mc-display">
<div class="mc-label">Current</div>
<div class="mc-value" id="currentMC">$0M</div>
</div>
<div class="mc-progress">
<div class="mc-bar" id="mcBar" style="width:0%"></div>
</div>
<div class="trigger">
<div class="trigger-label">🚀 BUY @ MC</div>
<input type="number" class="trigger-input" id="buyMC" placeholder="Buy at $2M" value="2">
<div class="trigger-status" id="buyStatus">
<span>Waiting...</span>
<span id="buyDist">+$2.0M</span>
</div>
</div>
<div class="trigger">
<div class="trigger-label">⚡ SELL @ MC</div>
<input type="number" class="trigger-input" id="sellMC" placeholder="Sell at $3M" value="3">
<div class="trigger-status" id="sellStatus">
<span>Waiting...</span>
<span id="sellDist">+$3.0M</span>
</div>
</div>
</div>
<div class="sec">
<div class="sec-title">⚡ Quick Trade</div>
<button class="quick-buy" onclick="quickBuy()">🚀 BUY NOW</button>
<button class="quick-exit" onclick="quickExit()">⚡ EXIT</button>
</div>
</div>
</div>

<div id="triggersSection" style="display:none;background:#0c1120;overflow-y:auto;padding:16px;flex:1;border:1px solid #00e67630;border-radius:4px">
<h2 style="color:#00e676;margin-bottom:12px">🎯 Market Cap Triggers</h2>
<div style="background:#0b1220;border:1px solid #00e67630;border-radius:8px;padding:16px">
<div class="input-group">
<label style="color:#ffffff60;font-size:8px;display:block;margin-bottom:4px">BUY TRIGGER (Market Cap in $M)</label>
<input type="number" id="triggerBuyMC" placeholder="2" value="2" style="font-size:10px;padding:8px">
</div>
<div class="input-group">
<label style="color:#ffffff60;font-size:8px;display:block;margin-bottom:4px">SELL TRIGGER (Market Cap in $M)</label>
<input type="number" id="triggerSellMC" placeholder="3" value="3" style="font-size:10px;padding:8px">
</div>
<div class="input-group">
<label style="color:#ffffff60;font-size:8px;display:block;margin-bottom:4px">BUY AMOUNT (SOL)</label>
<input type="number" id="triggerBuyAmt" placeholder="0.5" value="0.5" style="font-size:10px;padding:8px">
</div>
<button class="btn" onclick="saveTriggers()" style="padding:10px;margin-top:12px;background:#00e67620;font-size:10px">✓ Set Triggers</button>
</div>
<h3 style="color:#00e676;margin-top:20px;margin-bottom:12px">📋 Active Triggers</h3>
<div id="activeTriggers"></div>
</div>

<div id="historySection" style="display:none;background:#0c1120;overflow-y:auto;padding:16px;flex:1;border:1px solid #00e67630;border-radius:4px">
<h2 style="color:#00e676;margin-bottom:12px">📊 Trade History</h2>
<div id="historyContent"></div>
</div>

<div id="portfolioSection" style="display:none;background:#0c1120;overflow-y:auto;padding:16px;flex:1;border:1px solid #00e67630;border-radius:4px">
<h2 style="color:#00e676;margin-bottom:12px">💼 Portfolio</h2>
<div id="portfolioContent"></div>
</div>

<script>
const tokens = [
{name:"PEPE2",icon:"🐸",price:0.000042,mc:1.2,ch:182.4,vol:"2.4M",score:95},
{name:"BONK2",icon:"🔨",price:0.00213,mc:1.8,ch:34.2,vol:"1.1M",score:88},
{name:"DOGWIF3",icon:"🐶",price:0.0081,mc:2.5,ch:12.7,vol:"2.3M",score:62},
{name:"MOON",icon:"🌙",price:0.00088,mc:0.9,ch:44.1,vol:"670K",score:91},
{name:"FLOKI",icon:"⚡",price:0.0000234,mc:4.2,ch:267.3,vol:"8.9M",score:92},
{name:"ELON",icon:"🚀",price:0.00000456,mc:5.8,ch:523.7,vol:"12.3M",score:87},
{name:"SHIB2",icon:"🐕",price:0.000089,mc:2.2,ch:156.2,vol:"5.2M",score:84},
{name:"SAITAMA",icon:"🥋",price:0.0000089,mc:1.5,ch:145.6,vol:"4.5M",score:81}
];

let sel = null;
let triggers = {};
let history = [];
let portfolio = [];

const tl = document.getElementById("tokList");
tokens.forEach((t, i) => {
const d = document.createElement("div");
d.className = "tok show";
d.id = "tok" + i;
const ch = t.ch > 0 ? '#00e676' : '#ff1744';
d.innerHTML = `<div><div style="font-size:14px">${t.icon}</div><div style="color:#fff;font-weight:700;font-size:9px">${t.name}</div><div style="color:${ch};font-size:8px">${t.ch>0?'+':''}${t.ch}%</div><div style="color:#00e676;font-size:8px;margin-top:3px">MC: $${t.mc}M</div></div>`;
d.onclick = () => select(i);
tl.appendChild(d);
});

function filterTokens() {
const q = document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".tok").forEach(t => {
t.style.display = t.textContent.toLowerCase().includes(q) ? "block" : "none";
});
}

function select(i) {
sel = tokens[i];
document.querySelectorAll(".tok").forEach(x => x.classList.remove("sel"));
document.getElementById("tok" + i).classList.add("sel");
document.getElementById("topbar").textContent = `${sel.icon} ${sel.name}`;
document.getElementById("price").textContent = "$" + sel.price.toFixed(6);
document.getElementById("mc").textContent = "$" + sel.mc.toFixed(1) + "M";
document.getElementById("change").textContent = (sel.ch>0?'+':'') + sel.ch + "%";
document.getElementById("change").style.color = sel.ch > 0 ? '#00e676' : '#ff1744';
document.getElementById("currentMC").textContent = "$" + sel.mc.toFixed(2) + "M";
updateTriggerDisplay();
showView(0);
checkTriggers();
}

function updateTriggerDisplay() {
if(!sel) return;
const buyMC = parseFloat(document.getElementById("buyMC").value) || 2;
const sellMC = parseFloat(document.getElementById("sellMC").value) || 3;
const buyDist = buyMC - sel.mc;
const sellDist = sellMC - sel.mc;

document.getElementById("buyDist").textContent = buyDist > 0 ? '+$' + buyDist.toFixed(1) + 'M' : '✅ HIT';
document.getElementById("sellDist").textContent = sellDist > 0 ? '+$' + sellDist.toFixed(1) + 'M' : '✅ HIT';

document.getElementById("buyStatus").classList.toggle("active", sel.mc >= buyMC);
document.getElementById("sellStatus").classList.toggle("active", sel.mc >= sellMC);

const maxMC = Math.max(buyMC, sellMC, sel.mc) * 1.2;
const barWidth = (sel.mc / maxMC) * 100;
document.getElementById("mcBar").style.width = barWidth + "%";
}

function showView(v) {
const c = document.getElementById("content");
c.innerHTML = "";
if(!sel) return;

if(v === 0) {
let h = "<div class='chart'>";
for(let j=0;j<80;j++){
const ht = 20 + Math.sin(j*0.3+sel.name.length)*30 + Math.random()*25;
const col = Math.random() > 0.4 ? '#00e676' : '#ff1744';
h += `<div class='bar' style='background:${col};height:${ht}%'></div>`;
}
h += "</div>";
c.innerHTML = h;
} else if(v === 1) {
const buyMC = parseFloat(document.getElementById("buyMC").value) || 2;
const sellMC = parseFloat(document.getElementById("sellMC").value) || 3;
c.innerHTML = `<div class="card"><div style="color:#00e676;font-weight:900;margin-bottom:12px">🎯 Triggers Active</div><div style="margin-bottom:12px"><div style="color:#00e676;font-weight:700;margin-bottom:4px">🚀 BUY @ $${buyMC}M MC</div><div style="font-size:8px;color:#ffffff60">Current: $${sel.mc.toFixed(2)}M</div><div style="font-size:8px;color:#00e676;margin-top:4px">${sel.mc >= buyMC ? '✅ TRIGGER READY' : 'Waiting ' + (buyMC - sel.mc).toFixed(2) + 'M more'}</div></div><div><div style="color:#ff1744;font-weight:700;margin-bottom:4px">⚡ SELL @ $${sellMC}M MC</div><div style="font-size:8px;color:#ffffff60">Current: $${sel.mc.toFixed(2)}M</div><div style="font-size:8px;color:#ff1744;margin-top:4px">${sel.mc >= sellMC ? '✅ TRIGGER READY' : 'Waiting ' + (sellMC - sel.mc).toFixed(2) + 'M more'}</div></div></div>`;
} else if(v === 2) {
let sorted = [...tokens].sort((a,b) => b.ch - a.ch);
let h = "";
sorted.slice(0,8).forEach(t => {
const col = t.ch > 0 ? '#00e676' : '#ff1744';
h += `<div class="card" style="display:flex;justify-content:space-between"><div>${t.icon} ${t.name}</div><div style="color:${col};font-weight:900">${t.ch>0?'+':''}${t.ch}%</div></div>`;
});
c.innerHTML = h;
}
}

function quickBuy() {
if(!sel) return alert("Select token!");
notify(`🚀 BUY ${sel.name} @ $${sel.price.toFixed(6)}`, "buy");
history.push({type:"BUY",token:sel.name,mc:sel.mc,time:new Date().toLocaleTimeString()});
}

function quickExit() {
if(!sel) return alert("Select token!");
notify(`⚡ SOLD ${sel.name} @ $${sel.price.toFixed(6)}`, "sell");
history.push({type:"SELL",token:sel.name,mc:sel.mc,time:new Date().toLocaleTimeString()});
}

function saveTriggers() {
if(!sel) return alert("Select token!");
const buyMC = document.getElementById("triggerBuyMC").value;
const sellMC = document.getElementById("triggerSellMC").value;
const buyAmt = document.getElementById("triggerBuyAmt").value;
if(!buyMC || !sellMC || !buyAmt) return;
document.getElementById("buyMC").value = buyMC;
document.getElementById("sellMC").value = sellMC;
triggers[sel.name] = {buyMC:parseFloat(buyMC),sellMC:parseFloat(sellMC),buyAmt:parseFloat(buyAmt)};
notify(`✓ Triggers saved for ${sel.name}`, "buy");
updateActiveTriggers();
updateTriggerDisplay();
}

function updateActiveTriggers() {
const at = document.getElementById("activeTriggers");
if(Object.keys(triggers).length === 0) {
at.innerHTML = "<div style='color:#ffffff40'>No active triggers</div>";
return;
}
at.innerHTML = Object.entries(triggers).map(([token,t]) => {
const tok = tokens.find(x => x.name === token);
const buyReady = tok && tok.mc >= t.buyMC;
const sellReady = tok && tok.mc >= t.sellMC;
return `<div class="card"><div style="font-weight:900;margin-bottom:8px">${tok?.icon} ${token}</div><div style="font-size:8px;margin-bottom:6px"><div style="color:${buyReady?'#00e676':'#ffffff60'}">🚀 BUY @ $${t.buyMC}M ${buyReady?'✅':''}</div><div style="color:${sellReady?'#ff1744':'#ffffff60'};margin-top:4px">⚡ SELL @ $${t.sellMC}M ${sellReady?'✅':''}</div></div></div>`;
}).join('');
}

function checkTriggers() {
if(!sel) return;
const t = triggers[sel.name];
if(!t) return;

if(sel.mc >= t.buyMC && !history.find(h => h.type === "BUY" && h.token === sel.name && h.mc === sel.mc)) {
notify(`🚀 AUTO BUY TRIGGERED! ${sel.name} hit $${t.buyMC}M MC`, "buy");
history.push({type:"BUY",token:sel.name,mc:sel.mc,time:new Date().toLocaleTimeString(),auto:true});
}

if(sel.mc >= t.sellMC && !history.find(h => h.type === "SELL" && h.token === sel.name && h.mc === sel.mc)) {
notify(`⚡ AUTO SELL TRIGGERED! ${sel.name} hit $${t.sellMC}M MC`, "sell");
history.push({type:"SELL",token:sel.name,mc:sel.mc,time:new Date().toLocaleTimeString(),auto:true});
}
}

function notify(msg, type) {
const n = document.createElement("div");
n.className = "notif " + type;
n.innerHTML = msg;
document.body.appendChild(n);
setTimeout(() => n.remove(), 5000);
}

function showSection(sec) {
document.getElementById("tradingSection").style.display = sec === "trading" ? "flex" : "none";
document.getElementById("triggersSection").style.display = sec === "triggers" ? "flex" : "none";
document.getElementById("historySection").style.display = sec === "history" ? "flex" : "none";
document.getElementById("portfolioSection").style.display = sec === "portfolio" ? "flex" : "none";
document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
event.target.classList.add("active");

if(sec === "history") {
let h = "";
history.forEach(tr => {
const auto = tr.auto ? " (AUTO)" : "";
h += `<div class="card"><div style="color:${tr.type==='BUY'?'#00e676':'#ff1744'};font-weight:900">${tr.type} ${tr.token}${auto}</div><div style="color:#ffffff60;font-size:8px">MC: $${tr.mc.toFixed(2)}M @ ${tr.time}</div></div>`;
});
if(h === "") h = "<div style='color:#ffffff40'>No trades yet</div>";
document.getElementById("historyContent").innerHTML = h;
} else if(sec === "portfolio") {
let h = "";
if(portfolio.length === 0) {
h = "<div style='color:#ffffff40'>Portfolio empty</div>";
}
document.getElementById("portfolioContent").innerHTML = h;
} else if(sec === "triggers") {
updateActiveTriggers();
}
}

// Update every second
setInterval(() => {
if(sel) {
sel.mc = sel.mc + (Math.random() - 0.45) * 0.1;
document.getElementById("currentMC").textContent = "$" + sel.mc.toFixed(2) + "M";
updateTriggerDisplay();
checkTriggers();
}
}, 1000);

select(0);
updateActiveTriggers();
</script>

</body>
</html>
