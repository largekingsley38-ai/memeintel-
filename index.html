<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MemeIntel - Axiom Terminal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#080c14;color:#e0e8f0;font-family:'Courier New',monospace;user-select:none;overflow:hidden;height:100vh}
.nav{display:flex;align-items:center;background:#060a10;border-bottom:1px solid #ffffff0e;padding:0 10px;height:44px;gap:6px;position:relative;z-index:100}
.logo{color:#00e676;font-size:13px;font-weight:900;letter-spacing:2px}
.nb{background:none;border:1px solid #ffffff15;color:#ffffff50;font-size:9px;cursor:pointer;padding:4px 8px;border-radius:4px;touch-action:manipulation}
.nb.on{background:#00e67620;border-color:#00e67650;color:#00e676}
.tick{overflow:hidden;background:#00e67606;border-bottom:1px solid #00e67618;padding:4px 0;white-space:nowrap;height:22px}
.ti{display:inline-block;animation:tk 22s linear infinite}
@keyframes tk{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.container{display:flex;height:calc(100vh - 66px);gap:0;overflow:hidden}
.lpanel{width:22%;background:#0a0f1a;border-right:1px solid #ffffff0e;overflow-y:auto;display:flex;flex-direction:column}
.lpanel::-webkit-scrollbar{width:4px}
.lpanel::-webkit-scrollbar-track{background:none}
.lpanel::-webkit-scrollbar-thumb{background:#ffffff15;border-radius:2px}
.tokhead{padding:8px;border-bottom:1px solid #ffffff08;font-size:9px;color:#ffffff40;font-weight:700;letter-spacing:1px}
.tokhead input{width:100%;padding:4px 6px;background:#0b1220;border:1px solid #ffffff15;color:#fff;border-radius:4px;font-size:10px;font-family:'Courier New',monospace}
.tokitem{padding:8px;border-bottom:1px solid #ffffff06;cursor:pointer;transition:0.15s;position:relative}
.tokitem:active{opacity:0.7}
.tokitem.sel{background:#00e67615;border-left:2px solid #00e676;padding-left:6px}
.tokitem-ico{font-size:18px;margin-bottom:3px}
.tokitem-name{color:#fff;font-weight:700;font-size:10px;margin-bottom:2px}
.tokitem-price{color:#ffffff40;font-size:9px;margin-bottom:2px}
.tokitem-ch{font-size:9px;font-weight:700;margin-bottom:2px}
.tokitem-risk{font-size:8px;display:inline-block;padding:2px 4px;border-radius:3px}
.cpanel{flex:1;background:#0c1120;border-right:1px solid #ffffff0e;display:flex;flex-direction:column;overflow:hidden}
.topinfo{padding:8px;border-bottom:1px solid #ffffff0e;background:#060a10;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:9px}
.topinfo-item{display:flex;align-items:center;gap:3px}
.tabs{display:flex;gap:2px;padding:6px;background:#060a10;border-bottom:1px solid #ffffff08}
.tab{flex:1;padding:6px;border-radius:4px;border:1px solid #ffffff15;background:none;color:#ffffff50;font-size:9px;font-weight:700;cursor:pointer;touch-action:manipulation;font-family:'Courier New',monospace}
.tab.on{background:#00e67615;border-color:#00e67650;color:#00e676}
.cview{flex:1;overflow-y:auto;padding:8px;display:none}
.cview.active{display:block}
.chartview{display:flex;align-items:flex-end;padding:8px;gap:1px;height:100%;overflow:hidden}
.bar{flex:1;border-radius:1px;min-width:2px;opacity:0.85}
.card{background:#0b1220;border-radius:6px;padding:8px;margin-bottom:6px;border:1px solid #ffffff08}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #ffffff06;font-size:9px}
.row:last-child{border:none}
.rpanel{width:22%;background:#0a0f1a;border-left:1px solid #ffffff0e;display:flex;flex-direction:column;overflow-y:auto}
.rpanel::-webkit-scrollbar{width:4px}
.rpanel::-webkit-scrollbar-track{background:none}
.rpanel::-webkit-scrollbar-thumb{background:#ffffff15;border-radius:2px}
.section{padding:8px;border-bottom:1px solid #ffffff08}
.section-title{font-size:8px;color:#ffffff40;font-weight:700;letter-spacing:2px;margin-bottom:6px;text-transform:uppercase}
.bs{display:flex;background:#0b1220;border-radius:4px;padding:2px;margin-bottom:6px;gap:2px}
.bsbtn{flex:1;padding:6px;border-radius:3px;border:none;font-size:10px;font-weight:700;cursor:pointer;text-transform:uppercase;touch-action:manipulation;font-family:'Courier New',monospace}
.amtrow{display:flex;gap:3px;margin-bottom:6px;flex-wrap:wrap}
.ab{flex:1;min-width:45%;padding:5px 2px;border-radius:3px;font-size:8px;font-weight:700;cursor:pointer;border:1px solid #ffffff15;background:#0b1826;color:#ffffff50;touch-action:manipulation;font-family:'Courier New',monospace}
.ab.on{background:#00e67615;border-color:#00e67650;color:#00e676}
.gobtn{width:100%;padding:10px;border-radius:6px;border:none;font-size:11px;font-weight:900;cursor:pointer;touch-action:manipulation;font-family:'Courier New',monospace;margin-bottom:6px}
.comm-item{background:#0b1220;padding:6px;border-radius:4px;margin-bottom:4px;border:1px solid #ffffff08}
.comm-label{font-size:8px;color:#ffffff40;margin-bottom:2px}
.comm-val{font-size:10px;font-weight:700;color:#00e676;display:flex;justify-content:space-between;align-items:center}
.comm-badge{font-size:8px;background:#00e67615;padding:2px 4px;border-radius:2px;color:#00e676}
.fl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:999;font-size:28px;font-weight:900;animation:fo 1.5s forwards}
@keyframes fo{0%,70%{opacity:1}100%{opacity:0}}
@media(max-width:768px){
  .container{flex-direction:column;height:auto}
  .lpanel{width:100%;height:auto;max-height:120px;border-right:none;border-bottom:1px solid #ffffff0e}
  .cpanel{width:100%;min-height:300px;border-right:none;border-bottom:1px solid #ffffff0e}
  .rpanel{width:100%;height:auto;border-left:none;overflow:auto}
  .cview{max-height:250px}
}
</style>
</head>
<body>
<div class="nav">
  <div class="logo">⚡ MEMEINTEL</div>
  <div style="flex:1"></div>
  <span style="color:#00e676;font-size:9px;font-weight:700" id="lb">● LIVE</span>
</div>
<div class="tick"><div class="ti" id="tk"></div></div>
<div class="container">
  <div class="lpanel">
    <div class="tokhead">
      TOKENS
      <input type="text" id="search" placeholder="Search..." style="margin-top:4px"/>
    </div>
    <div id="toklist"></div>
  </div>
  <div class="cpanel">
    <div class="topinfo" id="topinfo">
      <span style="color:#ffffff25;font-size:8px">👆 Select a token</span>
    </div>
    <div class="tabs">
      <button class="tab on" onclick="showChart()">📊 Chart</button>
      <button class="tab" onclick="showScan()">🛡️ Scanner</button>
      <button class="tab" onclick="showWhales()">🐋 Whales</button>
    </div>
    <div class="cview active" id="chartview"></div>
    <div class="cview" id="scanview"></div>
    <div class="cview" id="whaleview"></div>
  </div>
  <div class="rpanel">
    <div class="section">
      <div class="section-title">Order</div>
      <div class="bs">
        <button class="bsbtn" id="bb" onclick="setO('buy')" style="background:#00e676;color:#000">BUY</button>
        <button class="bsbtn" id="sb" onclick="setO('sell')" style="background:transparent;color:#ffffff40">SELL</button>
      </div>
      <div class="amtrow">
        <button class="ab on" onclick="pickA(this)">0.1</button>
        <button class="ab" onclick="pickA(this)">0.25</button>
        <button class="ab" onclick="pickA(this)">0.5</button>
        <button class="ab" onclick="pickA(this)">1 SOL</button>
      </div>
      <button class="gobtn" id="gobtn" onclick="doT()" style="background:linear-gradient(135deg,#00e676,#00b85e);color:#000">⚡ BUY · 0.2%</button>
    </div>
    <div class="section">
      <div class="section-title">Community</div>
      <div class="comm-item">
        <div class="comm-label">Discord</div>
        <div class="comm-val">
          <span id="discord">12.5k</span>
          <span class="comm-badge" id="discord-growth">+8%</span>
        </div>
      </div>
      <div class="comm-item">
        <div class="comm-label">Twitter/X</div>
        <div class="comm-val">
          <span id="twitter">8.3k</span>
          <span class="comm-badge" id="twitter-growth">+12%</span>
        </div>
      </div>
      <div class="comm-item">
        <div class="comm-label">Hype Momentum</div>
        <div class="comm-val">
          <span id="hype" style="color:#fff;font-size:12px;font-weight:900">🔥 RISING</span>
        </div>
      </div>
      <div class="comm-item">
        <div class="comm-label">Health Score</div>
        <div class="comm-val" style="font-size:14px;color:#00e676">
          <span id="health">78/100</span>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Risk Analysis</div>
      <div class="comm-item">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:9px">
          <span style="color:#ffffff40">Risk Level</span>
          <span id="riskbadge" style="background:#00e67615;color:#00e676;padding:2px 6px;border-radius:2px;font-weight:700">SAFE</span>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
var T=[
  {id:1,name:"PEPE2",icon:"🐸",price:0.000042,ch:182.4,vol:"890K",mc:"2.4M",risk:"SAFE",
   discord:12500,twitterX:4500,hypeScore:85,healthScore:92,
   soc:{tg:"+1.2k today",x:"4.5k mentions",eng:"Rising 📈"},
   oc:{bs:72,h:"+340",w:"🐋 $84k bought 3m ago"},
   chk:[["Mint Auth",1],["Liq Lock",1],["Renounced",1],["Honeypot",0],["Fake Vol",0]]},
  {id:2,name:"BONK2",icon:"🔨",price:0.00213,ch:34.2,vol:"1.1M",mc:"5.6M",risk:"SAFE",
   discord:8300,twitterX:2200,hypeScore:72,healthScore:85,
   soc:{tg:"+580 today",x:"2.2k mentions",eng:"Rising 📈"},
   oc:{bs:63,h:"+145",w:"🐋 $22k bought 12m ago"},
   chk:[["Mint Auth",1],["Liq Lock",1],["Renounced",1],["Honeypot",0],["Fake Vol",0]]},
  {id:3,name:"DOGWIF3",icon:"🐶",price:0.0081,ch:12.7,vol:"2.3M",mc:"8.1M",risk:"CAUTION",
   discord:5200,twitterX:1100,hypeScore:58,healthScore:68,
   soc:{tg:"+210 today",x:"1.1k mentions",eng:"Stable 📊"},
   oc:{bs:51,h:"+89",w:"No activity"},
   chk:[["Mint Auth",0],["Liq Lock",1],["Renounced",0],["Honeypot",0],["Fake Vol",0]]},
  {id:4,name:"MOON",icon:"🌙",price:0.00088,ch:44.1,vol:"670K",mc:"3.2M",risk:"SAFE",
   discord:7800,twitterX:1800,hypeScore:68,healthScore:80,
   soc:{tg:"+380 today",x:"1.8k mentions",eng:"Rising 📈"},
   oc:{bs:68,h:"+198",w:"🐋 $41k bought 8m ago"},
   chk:[["Mint Auth",1],["Liq Lock",1],["Renounced",1],["Honeypot",0],["Fake Vol",0]]},
  {id:5,name:"RUGBAIT",icon:"💀",price:0.00000091,ch:-62.1,vol:"44K",mc:"180K",risk:"DANGER",
   discord:230,twitterX:23,hypeScore:12,healthScore:18,
   soc:{tg:"-400 today",x:"23 mentions",eng:"Dying 📉"},
   oc:{bs:19,h:"-210",w:"🚨 Dev wallet selling!"},
   chk:[["Mint Auth",0],["Liq Lock",0],["Renounced",0],["Honeypot",1],["Fake Vol",1]]},
];
var RC={SAFE:"#00e676",CAUTION:"#ffab00",DANGER:"#ff1744"};
function fmt(p){return p<0.0001?p.toFixed(9):p<0.001?p.toFixed(7):p.toFixed(4);}
function formatNum(n){return n>1000?(n/1000).toFixed(1)+'k':n;}
var sel=null,ot="buy",vw="chart";
var tk=document.getElementById("tk");
tk.innerHTML=[...T,...T].map(function(t){
  return '<span style="margin-right:20px;color:'+(t.ch>0?'#00e676':'#ff1744')+';font-weight:700">'+t.icon+' '+t.name+' '+(t.ch>0?'+':'')+t.ch+'%</span>';
}).join('');
var tl=document.getElementById("toklist");
T.forEach(function(tok){
  var d=document.createElement("div");
  d.className="tokitem";
  d.id="tc"+tok.id;
  var chColor=tok.ch>0?'#00e676':'#ff1744';
  d.innerHTML='<div class="tokitem-ico">'+tok.icon+'</div>'+
    '<div class="tokitem-name">'+tok.name+'</div>'+
    '<div class="tokitem-price">$'+fmt(tok.price)+'</div>'+
    '<div class="tokitem-ch" style="color:'+chColor+'">'+(tok.ch>0?'+':'')+tok.ch+'%</div>'+
    '<div class="tokitem-risk" style="background:'+RC[tok.risk]+'15;color:'+RC[tok.risk]+'">●'+tok.risk+'</div>';
  d.addEventListener("click",function(){pick(tok);});
  tl.appendChild(d);
});
document.getElementById("search").addEventListener("input",function(e){
  var q=e.target.value.toLowerCase();
  document.querySelectorAll(".tokitem").forEach(function(item){
    var name=item.querySelector(".tokitem-name").textContent.toLowerCase();
    item.style.display=name.includes(q)?"block":"none";
  });
});
var whtml='';
[{t:"PEPE2",a:"BUY",amt:"$84,000",w:"7xKp...3mNq",c:"#00e676",icon:"🧠"},
 {t:"BONK2",a:"BUY",amt:"$22,000",w:"3nVx...9fAb",c:"#00e676",icon:"🧠"},
 {t:"RUGBAIT",a:"SELL",amt:"$89,000",w:"DEV...wallet",c:"#ff1744",icon:"🚨"},
 {t:"MOON",a:"BUY",amt:"$41,000",w:"9rTw...8bVz",c:"#00e676",icon:"🧠"},
].forEach(function(w){
  whtml+='<div class="card" style="border:1px solid '+w.c+'25;background:'+w.c+'08"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px">'+w.icon+'</span><div><div style="color:'+w.c+';font-weight:700;font-size:10px">'+w.a+' '+w.amt+'</div><div style="color:#ffffff50;font-size:9px">'+w.t+' · '+w.w+'</div></div></div></div>';
});
document.getElementById("whaleview").innerHTML=whtml;
function pick(tok){
  sel=tok;
  document.querySelectorAll(".tokitem").forEach(function(c){c.classList.remove("sel");});
  document.getElementById("tc"+tok.id).classList.add("sel");
  document.getElementById("lb").textContent="● "+tok.name;
  var rc=RC[tok.risk];
  document.getElementById("topinfo").innerHTML=
    '<div class="topinfo-item"><span style="font-size:16px">'+tok.icon+'</span></div>'+
    '<div class="topinfo-item" style="color:#fff;font-weight:700">'+tok.name+'</div>'+
    '<div class="topinfo-item" style="color:'+(tok.ch>0?'#00e676':'#ff1744')+';font-weight:700">'+(tok.ch>0?'+':'')+tok.ch+'%</div>'+
    '<div class="topinfo-item" style="color:#ffffff40">$'+fmt(tok.price)+'</div>'+
    '<div class="topinfo-item" style="background:'+rc+'15;border:1px solid '+rc+'40;color:'+rc+';font-weight:700;padding:2px 6px;border-radius:3px">'+tok.risk+'</div>';
  var cv=document.getElementById("chartview");
  cv.innerHTML="";
  for(var i=0;i<60;i++){
    var h=25+Math.sin(i*0.4+tok.id*2)*25+Math.random()*20;
    var bull=Math.random()>0.45;
    var b=document.createElement("div");
    b.className="bar";
    b.style.background=(bull?'#00e676':'#ff1744');
    b.style.height=h+"%";
    cv.appendChild(b);
  }
  var discGrowth=(tok.discord>5000)?'+8%':'+5%';
  var twitterGrowth=(tok.twitterX>3000)?'+12%':'+7%';
  var hypeIcon=tok.hypeScore>70?'🔥 RISING':tok.hypeScore>50?'📊 STABLE':'📉 FALLING';
  document.getElementById("discord").textContent=formatNum(tok.discord);
  document.getElementById("discord-growth").textContent=discGrowth;
  document.getElementById("twitter").textContent=formatNum(tok.twitterX);
  document.getElementById("twitter-growth").textContent=twitterGrowth;
  document.getElementById("hype").textContent=hypeIcon;
  document.getElementById("health").textContent=tok.healthScore+'/100';
  var riskColor=RC[tok.risk];
  document.getElementById("riskbadge").style.background=riskColor+'15';
  document.getElementById("riskbadge").style.color=riskColor;
  document.getElementById("riskbadge").textContent=tok.risk;
  var ckOk=["Disabled ✅","Locked ✅","Yes ✅","Clean ✅","None ✅"];
  var ckBad=["ACTIVE 🚨","UNLOCKED 🚨","No ⚠️","DETECTED 🚨","DETECTED 🚨"];
  var rows=tok.chk.map(function(c,i){
    var ok=(i<3)?c[1]:!c[1];
    return '<div class="row"><span style="color:#ffffff45">'+c[0]+'</span><span style="color:'+(ok?'#00e676':'#ff1744')+';font-weight:700">'+(ok?ckOk[i]:ckBad[i])+'</span></div>';
  }).join('');
  document.getElementById("scanview").innerHTML=
    '<div class="card" style="border:1px solid #a78bfa25"><div style="color:#a78bfa;font-size:8px;font-weight:700;letter-spacing:2px;margin-bottom:6px">📱 SOCIAL</div>'+
    '<div class="row"><span>Telegram</span><span>'+tok.soc.tg+'</span></div>'+
    '<div class="row"><span>Twitter/X</span><span>'+tok.soc.x+'</span></div>'+
    '<div class="row"><span>Engagement</span><span>'+tok.soc.eng+'</span></div></div>'+
    '<div class="card" style="border:1px solid #38bdf825"><div style="color:#38bdf8;font-size:8px;font-weight:700;letter-spacing:2px;margin-bottom:6px">⛓️ ON-CHAIN</div>'+
    '<div class="row"><span>Buy/Sell Ratio</span><span style="color:'+(tok.oc.bs>50?'#00e676':'#ff1744')+'">'+tok.oc.bs+'%</span></div>'+
    '<div class="row"><span>New Holders</span><span>'+tok.oc.h+'</span></div>'+
    '<div class="row"><span>Whale Activity</span><span style="color:'+(tok.oc.w.includes('🚨')?'#ff1744':tok.oc.w.includes('🐋')?'#00e676':'#ffffff60')+'">'+tok.oc.w+'</span></div></div>'+
    '<div class="card" style="border:1px solid '+rc+'25"><div style="color:'+rc+';font-size:8px;font-weight:700;letter-spacing:2px;margin-bottom:6px">🛡️ ANTI-RUG</div>'+rows+'</div>';
  if(vw==="chart") showChart();
  else if(vw==="scanner") showScan();
  else showWhales();
}
function showChart(){
  vw="chart";
  document.getElementById("chartview").classList.add("active");
  document.getElementById("scanview").classList.remove("active");
  document.getElementById("whaleview").classList.remove("active");
  document.querySelectorAll(".tab")[0].classList.add("on");
  document.querySelectorAll(".tab")[1].classList.remove("on");
  document.querySelectorAll(".tab")[2].classList.remove("on");
}
function showScan(){
  if(!sel){alert("Select a token first!");return;}
  vw="scanner";
  document.getElementById("chartview").classList.remove("active");
  document.getElementById("scanview").classList.add("active");
  document.getElementById("whaleview").classList.remove("active");
  document.querySelectorAll(".tab")[1].classList.add("on");
  document.querySelectorAll(".tab")[0].classList.remove("on");
  document.querySelectorAll(".tab")[2].classList.remove("on");
}
function showWhales(){
  vw="whales";
  document.getElementById("chartview").classList.remove("active");
  document.getElementById("scanview").classList.remove("active");
  document.getElementById("whaleview").classList.add("active");
  document.querySelectorAll(".tab")[2].classList.add("on");
  document.querySelectorAll(".tab")[0].classList.remove("on");
  document.querySelectorAll(".tab")[1].classList.remove("on");
}
function setO(t){
  ot=t;
  var bb=document.getElementById("bb"),sb=document.getElementById("sb"),go=document.getElementById("gobtn");
  if(t==="buy"){
    bb.style.cssText="flex:1;padding:6px;border-radius:3px;border:none;font-size:10px;font-weight:700;cursor:pointer;text-transform:uppercase;background:#00e676;color:#000;font-family:'Courier New',monospace";
    sb.style.cssText="flex:1;padding:6px;border-radius:3px;border:none;font-size:10px;font-weight:700;cursor:pointer;text-transform:uppercase;background:transparent;color:#ffffff40;font-family:'Courier New',monospace";
    go.style.cssText="width:100%;padding:10px;border-radius:6px;border:none;font-size:11px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#00e676,#00b85e);color:#000;font-family:'Courier New',monospace";
    go.textContent="⚡ BUY · 0.2%";
  }else{
    sb.style.cssText="flex:1;padding:6px;border-radius:3px;border:none;font-size:10px;font-weight:700;cursor:pointer;text-transform:uppercase;background:#ff1744;color:#fff;font-family:'Courier New',monospace";
    bb.style.cssText="flex:1;padding:6px;border-radius:3px;border:none;font-size:10px;font-weight:700;cursor:pointer;text-transform:uppercase;background:transparent;color:#ffffff40;font-family:'Courier New',monospace";
    go.style.cssText="width:100%;padding:10px;border-radius:6px;border:none;font-size:11px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#ff1744,#cc1036);color:#fff;font-family:'Courier New',monospace";
    go.textContent="💸 SELL · 0.2%";
  }
}
function pickA(btn){
  document.querySelectorAll(".ab").forEach(function(b){b.classList.remove("on");});
  btn.classList.add("on");
}
function doT(){
  if(!sel){alert("Select a token first!");return;}
  var f=document.createElement("div");
  f.className="fl";
  f.style.background=(ot==="buy"?"#00e67620":"#ff174420");
  f.style.color=(ot==="buy"?"#00e676":"#ff1744");
  f.textContent=ot==="buy"?"⚡ BOUGHT!":"💸 SOLD!";
  document.body.appendChild(f);
  setTimeout(function(){if(f.parentNode)f.remove();},1500);
}
pick(T[0]);
</script>
</body>
</html>
