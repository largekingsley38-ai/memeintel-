<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>MemeIntel</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080c14;color:#e0e8f0;font-family:'Courier New',monospace;height:100vh;overflow:hidden}.nav{display:flex;align-items:center;background:#060a10;border-bottom:1px solid #ffffff0e;padding:0 10px;height:44px;gap:6px}.logo{color:#00e676;font-size:13px;font-weight:900;letter-spacing:2px}.tick{background:#00e67606;border-bottom:1px solid #00e67618;padding:4px;height:22px;overflow:hidden}.ti{display:inline-block;animation:tk 20s linear infinite;white-space:nowrap}@keyframes tk{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}.main{display:flex;height:calc(100vh - 66px)}.left{width:20%;background:#0a0f1a;border-right:1px solid #ffffff0e;overflow-y:auto;padding:8px}.left::-webkit-scrollbar{width:3px}.left::-webkit-scrollbar-thumb{background:#00e676}.tok{padding:8px;border-bottom:1px solid #ffffff06;cursor:pointer;border-radius:4px}.tok.sel{background:#00e67615;border-left:2px solid #00e676}.tok-name{color:#fff;font-weight:700;font-size:10px}.tok-ch{font-size:9px;font-weight:700;margin-top:3px}.center{flex:1;background:#0c1120;border-right:1px solid #ffffff0e;display:flex;flex-direction:column;overflow:hidden}.tabs{display:flex;gap:2px;padding:6px;background:#060a10;border-bottom:1px solid #ffffff08}.tab{flex:1;padding:6px;border:1px solid #ffffff15;background:none;color:#ffffff50;font-size:9px;font-weight:700;cursor:pointer;border-radius:4px}.tab.on{background:#00e67615;color:#00e676;border-color:#00e67650}.view{flex:1;overflow-y:auto;padding:8px;display:none}.view.active{display:block}.chart{display:flex;align-items:flex-end;gap:1px;height:100%}.bar{flex:1;border-radius:1px;opacity:0.85}.card{background:#0b1220;border:1px solid #ffffff08;border-radius:6px;padding:8px;margin-bottom:6px}.row{display:flex;justify-content:space-between;padding:4px 0;font-size:9px;border-bottom:1px solid #ffffff06}.row:last-child{border:none}.right{width:20%;background:#0a0f1a;border-left:1px solid #ffffff0e;overflow-y:auto;padding:8px;display:flex;flex-direction:column}.right::-webkit-scrollbar{width:3px}.right::-webkit-scrollbar-thumb{background:#00e676}.sec{border-bottom:1px solid #ffffff08;padding:8px 0}.sec-title{font-size:7px;color:#ffffff40;font-weight:700;letter-spacing:2px;margin-bottom:6px;text-transform:uppercase}.bs{display:flex;gap:2px;margin-bottom:6px}.bsbtn{flex:1;padding:6px;border:none;border-radius:3px;font-size:10px;font-weight:700;cursor:pointer}.amts{display:flex;gap:2px;margin-bottom:6px;flex-wrap:wrap}.amt{flex:1;min-width:45%;padding:5px;border:1px solid #ffffff15;background:#0b1826;color:#ffffff50;border-radius:3px;font-size:8px;font-weight:700;cursor:pointer}.amt.on{background:#00e67615;border-color:#00e67650;color:#00e676}.gobtn{width:100%;padding:10px;border:none;border-radius:6px;font-size:11px;font-weight:900;cursor:pointer;margin-bottom:6px}.info{background:#0b1220;padding:6px;border-radius:4px;margin-bottom:4px;border:1px solid #ffffff08;font-size:9px}.modal{position:fixed;inset:0;background:#000000aa;display:none;align-items:center;justify-content:center;z-index:1000}.modal.show{display:flex}.modal-box{background:#0a0f1a;border:1px solid #ffffff15;border-radius:12px;padding:16px;width:90%;max-width:380px;max-height:70vh;overflow-y:auto}.whale{background:#0b1220;border:1px solid #ffffff08;border-radius:6px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}.whale-info{flex:1}.whale-name{color:#fff;font-weight:700;font-size:10px}.whale-stats{color:#ffffff40;font-size:8px;margin-top:3px}.wbtn{padding:6px 10px;border:none;border-radius:4px;font-size:8px;font-weight:700;cursor:pointer}.wbtn.follow{background:#00e67620;color:#00e676;border:1px solid #00e67650}.wbtn.unfollow{background:#ff174420;color:#ff1744;border:1px solid #ff174450}.notif{position:fixed;bottom:20px;right:20px;background:#0b1220;border:2px solid #00e676;border-radius:8px;padding:12px;max-width:260px;z-index:999;animation:slideIn 0.4s}@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(400px);opacity:0}}.notif.out{animation:slideOut 0.4s}.notif-hdr{display:flex;gap:6px;margin-bottom:6px}.notif-name{color:#00e676;font-weight:900;font-size:9px}.notif-act{color:#fff;font-size:8px;font-weight:700;margin:6px 0}.notif-btn{width:100%;padding:5px;background:#00e67620;border:1px solid #00e67650;color:#00e676;border-radius:4px;font-size:8px;font-weight:700;cursor:pointer}</style></head><body><div class="nav"><div class="logo">⚡ MEMEINTEL</div><div style="flex:1"></div><span style="color:#00e676;font-size:9px;font-weight:700">● LIVE</span></div><div class="tick"><div class="ti" id="tk"></div></div><div class="main"><div class="left"><input type="text" id="search" placeholder="Search..." style="width:100%;padding:4px;background:#0b1220;border:1px solid #ffffff15;color:#fff;border-radius:4px;font-size:9px;margin-bottom:8px"><div id="toks"></div></div><div class="center"><div style="padding:8px;border-bottom:1px solid #ffffff0e;background:#060a10;font-size:9px" id="info">👆 Select token</div><div class="tabs"><button class="tab on" onclick="switchTab('chart')">📊 Chart</button><button class="tab" onclick="switchTab('scanner')">🛡️ Scanner</button><button class="tab" onclick="switchTab('whales')">🐋 Whales</button></div><div class="view active" id="chart"></div><div class="view" id="scanner"></div><div class="view" id="whales"></div></div><div class="right"><div class="sec"><div class="sec-title">Order</div><div class="bs"><button class="bsbtn" id="buybtn" onclick="setOrder('buy')" style="background:#00e676;color:#000">BUY</button><button class="bsbtn" id="sellbtn" onclick="setOrder('sell')" style="background:transparent;color:#ffffff40">SELL</button></div><div class="amts"><button class="amt on" onclick="setAmt(this)">0.1</button><button class="amt" onclick="setAmt(this)">0.25</button><button class="amt" onclick="setAmt(this)">0.5</button><button class="amt" onclick="setAmt(this)">1</button></div><button class="gobtn" id="gobtn" onclick="execute()" style="background:linear-gradient(135deg,#00e676,#00b85e);color:#000">⚡ BUY</button></div><div class="sec"><div class="sec-title">Community</div><div class="info"><span style="color:#ffffff40">Discord</span> <span id="discord" style="color:#00e676;float:right">12.5k</span></div><div class="info"><span style="color:#ffffff40">Twitter</span> <span id="twitter" style="color:#00e676;float:right">8.3k</span></div><div class="info"><span style="color:#ffffff40">Hype</span> <span id="hype" style="color:#00e676;float:right">🔥 UP</span></div></div><div class="sec"><div class="sec-title">Whales</div><button onclick="showWhales()" style="width:100%;padding:8px;background:#00e67615;border:1px solid #00e67650;color:#00e676;border-radius:4px;font-size:9px;font-weight:700;cursor:pointer">🐋 FOLLOW</button></div></div></div><div class="modal" id="wModal"><div class="modal-box"><div style="display:flex;justify-content:space-between;margin-bottom:16px;border-bottom:1px solid #ffffff08;padding-bottom:12px"><div style="color:#00e676;font-weight:900;font-size:12px">🐋 TOP WHALES</div><button onclick="document.getElementById('wModal').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer">✕</button></div><div id="wlist"></div></div></div><script>const TOKENS=[{id:1,name:"PEPE2",icon:"🐸",price:0.000042,ch:182.4,risk:"SAFE",discord:12500,twitter:4500,hype:"🔥 UP",soc:{tg:"+1.2k",x:"4.5k"},oc:{bs:72,h:"+340"},chk:[["Mint Auth","✅"],["Liq Lock","✅"],["Renounced","✅"],["Honeypot","✅"],["Fake Vol","✅"]]},{id:2,name:"BONK2",icon:"🔨",price:0.00213,ch:34.2,risk:"SAFE",discord:8300,twitter:2200,hype:"📊 STABLE",soc:{tg:"+580",x:"2.2k"},oc:{bs:63,h:"+145"},chk:[["Mint Auth","✅"],["Liq Lock","✅"],["Renounced","✅"],["Honeypot","✅"],["Fake Vol","✅"]]},{id:3,name:"DOGWIF3",icon:"🐶",price:0.0081,ch:12.7,risk:"CAUTION",discord:5200,twitter:1100,hype:"📊 STABLE",soc:{tg:"+210",x:"1.1k"},oc:{bs:51,h:"+89"},chk:[["Mint Auth","⚠️"],["Liq Lock","✅"],["Renounced","⚠️"],["Honeypot","✅"],["Fake Vol","✅"]]},{id:4,name:"MOON",icon:"🌙",price:0.00088,ch:44.1,risk:"SAFE",discord:7800,twitter:1800,hype:"🔥 UP",soc:{tg:"+380",x:"1.8k"},oc:{bs:68,h:"+198"},chk:[["Mint Auth","✅"],["Liq Lock","✅"],["Renounced","✅"],["Honeypot","✅"],["Fake Vol","✅"]]},{id:5,name:"RUGBAIT",icon:"💀",price:0.00000091,ch:-62.1,risk:"DANGER",discord:230,twitter:23,hype:"📉 DOWN",soc:{tg:"-400",x:"23"},oc:{bs:19,h:"-210"},chk:[["Mint Auth","🚨"],["Liq Lock","🚨"],["Renounced","🚨"],["Honeypot","🚨"],["Fake Vol","🚨"]]}];const WHALES=[{id:1,name:"MegaWhale",icon:"🧠",win:78},{id:2,name:"SolanaBoss",icon:"💎",win:72},{id:3,name:"CryptoKing",icon:"👑",win:65},{id:4,name:"ProfitHunter",icon:"🎯",win:81},{id:5,name:"RiskyRick",icon:"⚡",win:58}];const RC={SAFE:"#00e676",CAUTION:"#ffab00",DANGER:"#ff1744"};let sel=null,ord="buy",followed=[];function fmt(p){return p<0.0001?p.toFixed(9):p.toFixed(4)}function fmt2(n){return n>1000?(n/1000).toFixed(1)+'k':n}const tl=document.getElementById("toks");TOKENS.forEach(t=>{const d=document.createElement("div");d.className="tok";d.id="t"+t.id;const ch=t.ch>0?'#00e676':'#ff1744';d.innerHTML=`<div style="font-size:16px;margin-bottom:3px">${t.icon}</div><div class="tok-name">${t.name}</div><div style="color:${ch};font-size:8px;font-weight:700">${t.ch>0?'+':''}${t.ch}%</div><div style="background:${RC[t.risk]}15;color:${RC[t.risk]};font-size:7px;padding:2px 4px;border-radius:3px;display:inline-block;margin-top:3px">●${t.risk}</div>`;d.onclick=()=>pick(t);tl.appendChild(d);});document.getElementById("tk").innerHTML=TOKENS.concat(TOKENS).map(t=>`<span style="margin-right:20px;color:${t.ch>0?'#00e676':'#ff1744'};font-weight:700">${t.icon} ${t.name} ${t.ch>0?'+':''}${t.ch}%</span>`).join('');document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.toLowerCase();document.querySelectorAll(".tok").forEach(t=>{const n=t.querySelector(".tok-name").textContent.toLowerCase();t.style.display=n.includes(q)?"block":"none";});});function pick(t){sel=t;document.querySelectorAll(".tok").forEach(x=>x.classList.remove("sel"));document.getElementById("t"+t.id).classList.add("sel");document.getElementById("info").textContent=`${t.icon} ${t.name} ${t.ch>0?'+':''}${t.ch}% $${fmt(t.price)}`;const cv=document.getElementById("chart");cv.innerHTML="";for(let i=0;i<60;i++){const h=25+Math.sin(i*0.4+t.id*2)*25+Math.random()*20;const b=document.createElement("div");b.className="bar";b.style.background=Math.random()>0.45?'#00e676':'#ff1744';b.style.height=h+"%";cv.appendChild(b);}let rows="";for(let i=0;i<5;i++){const ok=i<3?t.chk[i][1]==="✅":t.chk[i][1]==="✅";rows+=`<div class="row"><span style="color:#ffffff45">${t.chk[i][0]}</span><span style="color:${ok?'#00e676':'#ff1744'};font-weight:700">${t.chk[i][1]}</span></div>`;}document.getElementById("scanner").innerHTML=`<div class="card"><div style="color:#a78bfa;font-size:8px;font-weight:700;margin-bottom:6px">📱 SOCIAL</div><div class="row"><span>Telegram</span><span>${t.soc.tg}</span></div><div class="row"><span>Twitter</span><span>${t.soc.x}</span></div></div><div class="card"><div style="color:#38bdf8;font-size:8px;font-weight:700;margin-bottom:6px">⛓️ ON-CHAIN</div><div class="row"><span>Buy/Sell</span><span style="color:${t.oc.bs>50?'#00e676':'#ff1744'}">${t.oc.bs}%</span></div><div class="row"><span>Holders</span><span>${t.oc.h}</span></div></div><div class="card"><div style="color:${RC[t.risk]};font-size:8px;font-weight:700;margin-bottom:6px">🛡️ ANTI-RUG</div>${rows}</div>`;document.getElementById("whales").innerHTML=`<div class="card"><div style="display:flex;gap:8px"><span style="font-size:16px">🧠</span><div><div style="color:#00e676;font-weight:700;font-size:10px">BUY $84,000</div><div style="color:#ffffff50;font-size:9px">${t.name} · 7xKp</div></div></div></div><div class="card"><div style="display:flex;gap:8px"><span style="font-size:16px">💎</span><div><div style="color:#00e676;font-weight:700;font-size:10px">BUY $22,000</div><div style="color:#ffffff50;font-size:9px">${t.name} · 3nVx</div></div></div></div>`;document.getElementById("discord").textContent=fmt2(t.discord);document.getElementById("twitter").textContent=fmt2(t.twitter);document.getElementById("hype").textContent=t.hype;}function switchTab(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(v).classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));event.target.classList.add("on");}function setOrder(t){ord=t;if(t==="buy"){document.getElementById("buybtn").style.background="#00e676";document.getElementById("buybtn").style.color="#000";document.getElementById("sellbtn").style.background="transparent";document.getElementById("gobtn").style.background="linear-gradient(135deg,#00e676,#00b85e)";document.getElementById("gobtn").textContent="⚡ BUY";}else{document.getElementById("sellbtn").style.background="#ff1744";document.getElementById("sellbtn").style.color="#fff";document.getElementById("buybtn").style.background="transparent";document.getElementById("gobtn").style.background="linear-gradient(135deg,#ff1744,#cc1036)";document.getElementById("gobtn").textContent="💸 SELL";}}function setAmt(btn){document.querySelectorAll(".amt").forEach(x=>x.classList.remove("on"));btn.classList.add("on");}function execute(){if(!sel)return alert("Select token!");alert("✅ "+ord.toUpperCase()+" executed!");}function showWhales(){const list=document.getElementById("wlist");list.innerHTML="";WHALES.forEach(w=>{const d=document.createElement("div");d.className="whale";const isF=followed.find(x=>x.id===w.id);d.innerHTML=`<div class="whale-info"><div class="whale-name">${w.icon} ${w.name}</div><div class="whale-stats">Win: ${w.win}%</div></div><button class="wbtn ${isF?'unfollow':'follow'}" onclick="toggleFollow(${w.id},this)">${isF?'UNFOLLOW':'FOLLOW'}</button>`;list.appendChild(d);});document.getElementById("wModal").classList.add("show");}function toggleFollow(id,btn){const idx=followed.findIndex(x=>x.id===id);if(idx>-1){followed.splice(idx,1);btn.textContent="FOLLOW";btn.className="wbtn follow";}else{followed.push(WHALES.find(x=>x.id===id));btn.textContent="UNFOLLOW";btn.className="wbtn unfollow";}}function notify(){if(followed.length===0)return;const w=followed[Math.floor(Math.random()*followed.length)];const t=TOKENS[Math.floor(Math.random()*5)];const a=Math.random()>0.5?"BUY":"SELL";const n=document.createElement("div");n.className="notif";n.innerHTML=`<div class="notif-hdr"><span style="font-size:16px">${w.icon}</span><span class="notif-name">${w.name}</span></div><div class="notif-act">${a} $${Math.floor(Math.random()*100)+10}k ${t.name}</div><button class="notif-btn" onclick="this.parentNode.classList.add('out');setTimeout(()=>this.parentNode.remove(),400)">COPY</button>`;document.body.appendChild(n);setTimeout(()=>{n.classList.add("out");setTimeout(()=>n.remove(),400)},5000);}pick(TOKENS[0]);setInterval(notify,8000);</script></body></html>
