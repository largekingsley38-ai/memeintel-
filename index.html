<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemeIntel - Quick Trade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0e1a;color:#e0e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.app{display:flex;flex-direction:column;height:100vh}
.navbar{background:linear-gradient(90deg,#0f1629 0%,#1a2847 100%);border-bottom:1px solid #ffffff10;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;height:60px}
.logo{font-size:18px;font-weight:900;color:#00d4aa;letter-spacing:1px}
.nav-price{font-size:12px;color:#00d4aa;font-weight:700}
.container{display:flex;flex:1;overflow:hidden;gap:12px;padding:16px}
.tokens-panel{width:180px;background:#1a2847;border:1px solid #ffffff15;border-radius:12px;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.tokens-title{font-size:11px;font-weight:700;color:#00d4aa;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.token-search{width:100%;padding:10px;background:#0f1629;border:1px solid #ffffff15;border-radius:8px;color:#fff;font-size:11px;margin-bottom:10px;font-family:monospace}
.tokens-list{display:flex;flex-direction:column;gap:6px;flex:1}
.token-btn{width:100%;padding:12px;background:#0f1629;border:2px solid #ffffff15;border-radius:8px;cursor:pointer;transition:all 0.2s;text-align:center}
.token-btn:hover{background:#253857;border-color:#00d4aa40}
.token-btn.active{background:#253857;border:2px solid #00d4aa;box-shadow:0 0 16px #00d4aa25}
.token-icon{font-size:28px;margin-bottom:6px}
.token-name{font-size:11px;font-weight:700;color:#fff;margin-bottom:4px}
.token-change{font-size:10px;font-weight:700;color:#00d4aa;margin-bottom:2px}
.token-change.down{color:#ff4757}
.token-mc{font-size:9px;color:#7a8ba8}
.main-panel{flex:1;background:#1a2847;border:1px solid #ffffff15;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.token-display{background:linear-gradient(135deg,#253857,#1a3a52);border:1px solid #00d4aa30;border-radius:12px;padding:16px;display:flex;align-items:center;gap:16px}
.display-icon{font-size:48px}
.display-info h1{font-size:24px;color:#fff;margin-bottom:8px}
.display-price{font-size:20px;color:#00d4aa;font-weight:700;margin-bottom:6px}
.display-meta{display:flex;gap:16px;font-size:11px;color:#7a8ba8}
.meta-item{display:flex;gap:4px}
.meta-label{color:#7a8ba8}
.meta-value{color:#00d4aa;font-weight:700}
.trading-section{background:#0f1629;border:1px solid #ffffff10;border-radius:12px;padding:16px}
.trading-title{font-size:12px;font-weight:700;color:#fff;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
.amount-section{margin-bottom:14px}
.amount-label{font-size:10px;color:#7a8ba8;margin-bottom:6px;text-transform:uppercase}
.amount-input{width:100%;padding:12px;background:#0a0e1a;border:1px solid #ffffff15;border-radius:8px;color:#fff;font-size:14px;font-weight:700;font-family:monospace;margin-bottom:8px}
.amount-presets{display:flex;gap:6px}
.preset-btn{flex:1;padding:8px;background:#0a0e1a;border:1px solid #ffffff15;border-radius:6px;color:#00d4aa;font-size:10px;font-weight:700;cursor:pointer;transition:all 0.2s}
.preset-btn:hover{background:#253857;border-color:#00d4aa}
.slippage-section{margin-bottom:14px}
.slippage-label{font-size:10px;color:#7a8ba8;margin-bottom:6px;text-transform:uppercase}
.slippage-input{width:100%;padding:10px;background:#0a0e1a;border:1px solid #ffffff15;border-radius:8px;color:#fff;font-size:12px;font-family:monospace}
.buttons-section{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-buy{width:100%;padding:16px;background:linear-gradient(135deg,#00d4aa,#00a885);color:#000;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;transition:all 0.2s;font-family:monospace}
.btn-buy:hover{transform:translateY(-2px);box-shadow:0 8px 24px #00d4aa40}
.btn-sell{width:100%;padding:16px;background:linear-gradient(135deg,#ff4757,#ff1744);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;transition:all 0.2s;font-family:monospace}
.btn-sell:hover{transform:translateY(-2px);box-shadow:0 8px 24px #ff475740}
.info-boxes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.info-box{background:#0a0e1a;border:1px solid #ffffff10;border-radius:8px;padding:10px;text-align:center}
.info-label{font-size:9px;color:#7a8ba8;text-transform:uppercase;margin-bottom:4px}
.info-value{font-size:12px;font-weight:700;color:#00d4aa;word-break:break-word}
.info-small{font-size:8px;color:#7a8ba8;margin-top:3px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3f5d;border-radius:3px}
.notif{position:fixed;bottom:20px;right:20px;background:#1a2847;border:2px solid #00d4aa;border-radius:10px;padding:14px 18px;z-index:999;animation:slideIn 0.3s;font-size:11px}
@keyframes slideIn{from{transform:translateX(300px);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>

<div class="app">
<div class="navbar">
<div class="logo">⚡ MEMEINTEL</div>
<div class="nav-price" id="navPrice">$0</div>
</div>

<div class="container">
<div class="tokens-panel">
<div class="tokens-title">Select Token</div>
<input type="text" class="token-search" id="search" placeholder="Search..." onkeyup="filterTokens()">
<div class="tokens-list" id="tokensList"></div>
</div>

<div class="main-panel">
<div class="token-display">
<div class="display-icon" id="displayIcon">🐸</div>
<div class="display-info">
<h1 id="displayName">PEPE2</h1>
<div class="display-price" id="displayPrice">$0.000042</div>
<div class="display-meta">
<div class="meta-item">
<span class="meta-label">24H:</span>
<span class="meta-value" id="displayChange">+182.4%</span>
</div>
<div class="meta-item">
<span class="meta-label">MC:</span>
<span class="meta-value" id="displayMC">$1.2M</span>
</div>
<div class="meta-item">
<span class="meta-label">Vol:</span>
<span class="meta-value" id="displayVol">$2.4M</span>
</div>
</div>
</div>
</div>

<div class="trading-section">
<div class="trading-title">💰 Amount to Trade</div>
<div class="amount-section">
<div class="amount-label">SOL Amount</div>
<input type="number" class="amount-input" id="amount" placeholder="0.5" value="0.5">
<div class="amount-presets">
<button class="preset-btn" onclick="setAmount(0.1)">0.1</button>
<button class="preset-btn" onclick="setAmount(0.5)">0.5</button>
<button class="preset-btn" onclick="setAmount(1)">1</button>
<button class="preset-btn" onclick="setAmount(5)">5</button>
<button class="preset-btn" onclick="setAmount(10)">10</button>
</div>
</div>

<div class="slippage-section">
<div class="slippage-label">Slippage Tolerance %</div>
<input type="number" class="slippage-input" id="slippage" placeholder="2" value="2">
</div>

<div class="buttons-section">
<button class="btn-buy" onclick="buy()">💚 BUY</button>
<button class="btn-sell" onclick="sell()">❤️ SELL</button>
</div>
</div>

<div class="info-boxes">
<div class="info-box">
<div class="info-label">💲 Price</div>
<div class="info-value" id="infPrice">$0.000042</div>
</div>
<div class="info-box">
<div class="info-label">📈 ATH</div>
<div class="info-value" id="infoATH">$0.000089</div>
<div class="info-small">-52.8%</div>
</div>
<div class="info-box">
<div class="info-label">💧 Liquidity</div>
<div class="info-value" id="infoLiq">$450K</div>
</div>
<div class="info-box">
<div class="info-label">🔒 Lock</div>
<div class="info-value">✓ 2025</div>
</div>
</div>
</div>
</div>
</div>

<script>
const tokens = [
{name:"PEPE2",icon:"🐸",price:0.000042,ch:182.4,mc:1.2,vol:"2.4M",ath:0.000089,liq:"450K"},
{name:"BONK2",icon:"🔨",price:0.00213,ch:34.2,mc:1.8,vol:"1.1M",ath:0.00285,liq:"320K"},
{name:"DOGWIF3",icon:"🐶",price:0.0081,ch:12.7,mc:2.5,vol:"2.3M",ath:0.0095,liq:"580K"},
{name:"MOON",icon:"🌙",price:0.00088,ch:44.1,mc:0.9,vol:"670K",ath:0.0012,liq:"220K"},
{name:"FLOKI",icon:"⚡",price:0.0000234,ch:267.3,mc:4.2,vol:"8.9M",ath:0.000045,liq:"750K"},
{name:"ELON",icon:"🚀",price:0.00000456,ch:523.7,mc:5.8,vol:"12.3M",ath:0.000008,liq:"890K"},
{name:"SHIB2",icon:"🐕",price:0.000089,ch:156.2,mc:2.2,vol:"5.2M",ath:0.00015,liq:"620K"},
{name:"SAITAMA",icon:"🥋",price:0.0000089,ch:145.6,mc:1.5,vol:"4.5M",ath:0.000018,liq:"510K"}
];

let sel = tokens[0];

const tl = document.getElementById("tokensList");
tokens.forEach((t,i) => {
const d = document.createElement("button");
d.className = "token-btn" + (i === 0 ? " active" : "");
d.id = "tok" + i;
const chClass = t.ch > 0 ? "token-change" : "token-change down";
d.innerHTML = `<div class="token-icon">${t.icon}</div><div class="token-name">${t.name}</div><div class="${chClass}">${t.ch>0?'+':''}${t.ch}%</div><div class="token-mc">$${t.mc}M</div>`;
d.onclick = () => select(i);
tl.appendChild(d);
});

function filterTokens() {
const q = document.getElementById("search").value.toLowerCase();
tokens.forEach((t,i) => {
document.getElementById("tok" + i).style.display = t.name.toLowerCase().includes(q) ? "block" : "none";
});
}

function select(i) {
sel = tokens[i];
document.querySelectorAll(".token-btn").forEach(x => x.classList.remove("active"));
document.getElementById("tok" + i).classList.add("active");

document.getElementById("displayIcon").textContent = sel.icon;
document.getElementById("displayName").textContent = sel.name;
document.getElementById("displayPrice").textContent = "$" + sel.price.toFixed(8);
document.getElementById("displayChange").textContent = (sel.ch>0?'+':'') + sel.ch + "%";
document.getElementById("displayChange").style.color = sel.ch > 0 ? '#00d4aa' : '#ff4757';
document.getElementById("displayMC").textContent = "$" + sel.mc + "M";
document.getElementById("displayVol").textContent = sel.vol;
document.getElementById("navPrice").textContent = "$" + sel.price.toFixed(6);

document.getElementById("infPrice").textContent = "$" + sel.price.toFixed(8);
document.getElementById("infoATH").textContent = "$" + sel.ath.toFixed(8);
document.getElementById("infoLiq").textContent = sel.liq;
}

function setAmount(a) {
document.getElementById("amount").value = a;
}

function buy() {
const amt = document.getElementById("amount").value;
notify(`✅ BUY ${amt} SOL of ${sel.name}`);
}

function sell() {
const amt = document.getElementById("amount").value;
notify(`✅ SELL ${amt} SOL of ${sel.name}`);
}

function notify(msg) {
const n = document.createElement("div");
n.className = "notif";
n.innerHTML = msg;
document.body.appendChild(n);
setTimeout(() => n.remove(), 3000);
}

select(0);
</script>

</body>
</html>
