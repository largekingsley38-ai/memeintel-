<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MemeIntel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#080c14;color:#e0e8f0;font-family:'Courier New',monospace;user-select:none;overflow-x:hidden}
.nav{display:flex;align-items:center;background:#060a10;border-bottom:1px solid #ffffff0e;padding:0 10px;height:44px;gap:6px}
.logo{color:#00e676;font-size:13px;font-weight:900;letter-spacing:2px}
.nb{background:none;border:1px solid #ffffff15;color:#ffffff50;font-size:9px;cursor:pointer;padding:4px 8px;border-radius:4px;touch-action:manipulation}
.nb.on{background:#00e67620;border-color:#00e67650;color:#00e676}
.tick{overflow:hidden;background:#00e67606;border-bottom:1px solid #00e67618;padding:4px 0;white-space:nowrap}
.ti{display:inline-block;animation:tk 22s linear infinite}
@keyframes tk{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* TOKEN LIST - horizontal scrollable at top */
.tokscroll{display:flex;overflow-x:auto;background:#060a10;border-bottom:1px solid #ffffff08;padding:8px;gap:8px;-webkit-overflow-scrolling:touch}
.tokscroll::-webkit-scrollbar{display:none}
.tokcard{flex-shrink:0;background:#0b1220;border:2px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer;touch-action:manipulation;min-width:90px;text-align:center}
.tokcard.sel{border-color:#00e676;background:#0d1f35}
.tokcard:active{opacity:0.7}

/* MAIN CONTENT */
.content{display:flex;flex-direction:column;height:calc(100vh - 130px);overflow:hidden}
.topinfo{padding:10px 12px;border-bottom:1px solid #ffffff08;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#060a10;min-height:48px}
.tabs{display:flex;gap:6px;padding:8px 10px;background:#060a10;border-bottom:1px solid #ffffff08}
.tab{flex:1;padding:8px;border-radius:6px;border:1px solid #ffffff15;background:none;color:#ffffff50;font-size:10px;font-weight:700;cursor:pointer;touch-action:manipulation;font-family:'Courier New',monospace}
.tab.on{background:#00e67615;border-color:#00e67650;color:#00e676}

/* CHART */
.chartview{flex:1;display:flex;align-items:flex-end;padding:12px;gap:1px;overflow:hidden}
.bar{flex:1;border-radius:1px;min-width:2px}

/* SCANNER */
.scanview{flex:1;overflow-y:auto;padding:10px;display:none}
.card{background:#0b1220;border-radius:8px;padding:10px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ffffff06;font-size:11px}
.row:last-child{border:none}

/* TRADE PANEL - fixed at bottom */
.tradepanel{background:#060a10;border-top:1px solid #ffffff0e;padding:10px 12px}
.bs{display:flex;background:#0b1220;border-radius:6px;padding:2px;margin-bottom:8px;gap:2px}
.bsbtn{flex:1;padding:8px;border-radius:5px;border:none;font-size:12px;font-weight:900;cursor:pointer;text-transform:uppercase;touch-action:manipulation;font-family:'Courier New',monospace}
.amtrow{display:flex;gap:4px;margin-bottom:8px}
.ab{flex:1;padding:6px 2px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid #ffffff15;background:#0b1826;color:#ffffff50;touch-action:manipulation;font-family:'Courier New',monospace}
.ab.on{background:#00e67615;border-color:#00e67650;color:#00e676}
.gobtn{width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:900;cursor:pointer;touch-action:manipulation;font-family:'Courier New',monospace}
.fl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:999;font-size:32px;font-weight:900;animation:fo 1.5s forwards}
@keyframes fo{0%,70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<!-- NAV -->
<div class="nav">
  <div class="logo">⚡ MEMEINTEL</div>
  <div style="flex:1"></div>
  <span style="color:#00e676;font-size:9px;font-weight:700" id="lb">● LIVE</span>
</div>

<!-- TICKER -->
<div class="tick"><div class="ti" id="tk"></div></div>

<!-- TOKEN CARDS (horizontal scroll) -->
<div class="tokscroll" id="tokscroll"></div>

<!-- CONTENT -->
<div class="content">
  <!-- Token Info Header -->
  <div class="topinfo" id="topinfo">
    <span style="color:#ffffff25;font-size:11px">👆 Select a token above</span>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab on" id="chartbtn" ontouchstart="" onclick="showChart()">📊 Chart</button>
    <button class="tab" id="scanbtn" ontouchstart="" onclick="showScan()">🛡️ Scanner</button>
    <button class="tab" id="whalebtn" ontouchstart="" onclick="showWhales()">🐋 Whales</button>
  </div>

  <!-- Chart View -->
  <div class="chartview" id="chartview"></div>

  <!-- Scanner View -->
  <div class="scanview" id="scanview"></div>

  <!-- Whales View -->
  <div class="scanview" id="whaleview"></div>
</div>

<!-- TRADE PANEL (fixed bottom) -->
<div class="tradepanel">
  <div class="bs">
    <button class="bsbtn" id="bb" ontouchstart="" onclick="setO('buy')" style="background:#00e676;color:#000">BUY</button>
    <button class="bsbtn" id="sb" ontouchstart="" onclick="setO('sell')" style="background:transparent;color:#ffffff40">SELL</button>
  </div>
  <div class="amtrow">
    <button class="ab on" ontouchstart="" onclick="pickA(this)">0.1</button>
    <button class="ab" ontouchstart="" onclick="pickA(this)">0.25</button>
    <button class="ab" ontouchstart="" onclick="pickA(this)">0.5</button>
    <button class="ab" ontouchstart="" onclick="pickA(this)">1 SOL</button>
  </div>
  <button class="gobtn" id="gobtn" ontouchstart="" onclick="doT()" style="background:linear-gradient(135deg,#00e676,#00b85e);color:#000">⚡ BUY NOW · Fee: 0.2%</button>
</div>

<script>
var T=[
  {id:1,name:"PEPE2",icon:"🐸",price:0.000042,ch:182.4,vol:"890K",mc:"2.4M",risk:"SAFE",
   soc:{tg:"+1.2k today",x:"4.5k mentions",eng:"Rising 📈"},
   oc:{bs:72,h:"+340",w:"🐋 $84k bought 3m ago"},
   chk:[["Mint Auth",1],["Liq Lock",1],["Renounced",1],["Honeypot",0],["Fake Vol",0]]},
  {id:2,name:"BONK2",icon:"🔨",price:0.00213,ch:34.2,vol:"1.1M",mc:"5.6M",risk:"SAFE",
   soc:{tg:"+580 today",x:"2.2k mentions",eng:"Rising 📈"},
   oc:{bs:63,h:"+145",w:"🐋 $22k bought 12m ago"},
   chk:[["Mint Auth",1],["Liq Lock",1],["Renounced",1],["Honeypot",0],["Fake Vol",0]]},
  {id:3,name:"DOGWIF3",icon:"🐶",price:0.0081,ch:12.7,vol:"2.3M",mc:"8.1M",risk:"CAUTION",
   soc:{tg:"+210 today",x:"1.1k mentions",eng:"Stable 📊"},
   oc:{bs:51,h:"+89",w:"No activity"},
   chk:[["Mint Auth",0],["Liq Lock",1],["Renounced",0],["Honeypot",0],["Fake Vol",0]]},
  {id:4,name:"MOON",icon:"🌙",price:0.00088,ch:44.1,vol:"670K",mc:"3.2M",risk:"SAFE",
   soc:{tg:"+380 today",x:"1.8k mentions",eng:"Rising 📈"},
   oc:{bs:68,h:"+198",w:"🐋 $41k bought 8m ago"},
   chk:[["Mint Auth",1],["Liq Lock",1],["Renounced",1],["Honeypot",0],["Fake Vol",0]]},
  {id:5,name:"RUGBAIT",icon:"💀",price:0.00000091,ch:-62.1,vol:"44K",mc:"180K",risk:"DANGER",
   soc:{tg:"-400 today",x:"23 mentions",eng:"Dying 📉"},
   oc:{bs:19,h:"-210",w:"🚨 Dev wallet selling!"},
   chk:[["Mint Auth",0],["Liq Lock",0],["Renounced",0],["Honeypot",1],["Fake Vol",1]]},
];

var RC={SAFE:"#00e676",CAUTION:"#ffab00",DANGER:"#ff1744"};
function fmt(p){return p<0.0001?p.toFixed(9):p<0.001?p.toFixed(7):p.toFixed(4);}
var sel=null,ot="buy",vw="chart";

// Ticker
var tk=document.getElementById("tk");
tk.innerHTML=[...T,...T].map(function(t){
  return '<span style="margin-right:20px;color:'+(t.ch>0?'#00e676':'#ff1744')+';font-weight:700">'+t.icon+' '+t.name+' '+(t.ch>0?'+':'')+t.ch+'%</span>';
}).join('');

// Token Cards
var ts=document.getElementById("tokscroll");
T.forEach(function(tok){
  var d=document.createElement("div");
  d.className="tokcard";
  d.id="tc"+tok.id;
  d.innerHTML='<div style="font-size:22px">'+tok.icon+'</div><div style="color:#fff;font-weight:700;font-size:11px;margin-top:3px">'+tok.name+'</div><div style="color:'+(tok.ch>0?'#00e676':'#ff1744')+';font-size:10px;font-weight:700;margin-top:2px">'+(tok.ch>0?'+':'')+tok.ch+'%</div><div style="color:'+RC[tok.risk]+';font-size:8px;margin-top:2px">●'+tok.risk+'</div>';
  d.addEventListener("click",function(){pick(tok);});
  d.addEventListener("touchend",function(e){e.preventDefault();pick(tok);});
  ts.appendChild(d);
});

// Whale content
var whtml='';
[{t:"PEPE2",a:"BUY",amt:"$84,000",w:"7xKp...3mNq",c:"#00e676",icon:"🧠"},
 {t:"BONK2",a:"BUY",amt:"$22,000",w:"3nVx...9fAb",c:"#00e676",icon:"🧠"},
 {t:"RUGBAIT",a:"SELL",amt:"$89,000",w:"DEV...wallet",c:"#ff1744",icon:"🚨"},
 {t:"MOON",a:"BUY",amt:"$41,000",w:"9rTw...8bVz",c:"#00e676",icon:"🧠"},
].forEach(function(w){
  whtml+='<div style="background:'+w.c+'10;border:1px solid '+w.c+'25;border-radius:8px;padding:10px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">'+w.icon+'</span><div><div style="color:'+w.c+';font-weight:700;font-size:12px">'+w.a+' '+w.amt+'</div><div style="color:#ffffff50;font-size:10px">'+w.t+' · '+w.w+'</div></div></div></div>';
});
document.getElementById("whaleview").innerHTML=whtml;

function pick(tok){
  sel=tok;
  document.querySelectorAll(".tokcard").forEach(function(c){c.classList.remove("sel");});
  document.getElementById("tc"+tok.id).classList.add("sel");
  document.getElementById("lb").textContent="● "+tok.name;

  var rc=RC[tok.risk];
  document.getElementById("topinfo").innerHTML=
    '<span style="font-size:18px">'+tok.icon+'</span>'+
    '<span style="color:#fff;font-weight:800;font-size:14px">'+tok.name+'</span>'+
    '<span style="color:'+(tok.ch>0?'#00e676':'#ff1744')+';font-weight:700;font-size:12px">'+(tok.ch>0?'+':'')+tok.ch+'%</span>'+
    '<span style="color:#ffffff40;font-size:10px">$'+fmt(tok.price)+'</span>'+
    '<span style="background:'+rc+'15;border:1px solid '+rc+'40;color:'+rc+';font-size:8px;font-weight:800;border-radius:4px;padding:2px 8px;margin-left:auto">'+tok.risk+'</span>';

  // Chart
  var cv=document.getElementById("chartview");
  cv.innerHTML="";
  for(var i=0;i<50;i++){
    var h=25+Math.sin(i*0.4+tok.id*2)*25+Math.random()*20;
    var bull=Math.random()>0.45;
    var b=document.createElement("div");
    b.style.cssText="flex:1;height:"+h+"%;background:"+(bull?'#00e676':'#ff1744')+";border-radius:1px;opacity:0.85;min-width:2px";
    cv.appendChild(b);
  }

  // Scanner
  var ckOk=["Disabled ✅","Locked ✅","Yes ✅","Clean ✅","None ✅"];
  var ckBad=["ACTIVE 🚨","UNLOCKED 🚨","No ⚠️","DETECTED 🚨","DETECTED 🚨"];
  var rows=tok.chk.map(function(c,i){
    var ok=(i<3)?c[1]:!c[1];
    return '<div class="row"><span style="color:#ffffff45">'+c[0]+'</span><span style="color:'+(ok?'#00e676':'#ff1744')+'">'+(ok?ckOk[i]:ckBad[i])+'</span></div>';
  }).join('');

  document.getElementById("scanview").innerHTML=
    '<div class="card" style="border:1px solid #a78bfa25"><div style="color:#a78bfa;font-size:9px;font-weight:700;letter-spacing:2px;margin-bottom:8px">📱 SOCIAL SIGNALS</div>'+
    '<div class="row"><span style="color:#ffffff45">Telegram</span><span style="color:#fff">'+tok.soc.tg+'</span></div>'+
    '<div class="row"><span style="color:#ffffff45">Twitter/X</span><span style="color:#fff">'+tok.soc.x+'</span></div>'+
    '<div class="row"><span style="color:#ffffff45">Engagement</span><span style="color:#fff">'+tok.soc.eng+'</span></div></div>'+
    '<div class="card" style="border:1px solid #38bdf825"><div style="color:#38bdf8;font-size:9px;font-weight:700;letter-spacing:2px;margin-bottom:8px">⛓️ ON-CHAIN</div>'+
    '<div class="row"><span style="color:#ffffff45">Buy/Sell Ratio</span><span style="color:'+(tok.oc.bs>50?'#00e676':'#ff1744')+'">'+tok.oc.bs+'% buys</span></div>'+
    '<div class="row"><span style="color:#ffffff45">New Holders</span><span style="color:#fff">'+tok.oc.h+'</span></div>'+
    '<div class="row"><span style="color:#ffffff45">Whale Activity</span><span style="color:'+(tok.oc.w.includes('🚨')?'#ff1744':tok.oc.w.includes('🐋')?'#00e676':'#ffffff60')+'">'+tok.oc.w+'</span></div></div>'+
    '<div class="card" style="border:1px solid '+rc+'25"><div style="color:'+rc+';font-size:9px;font-weight:700;letter-spacing:2px;margin-bottom:8px">🛡️ ANTI-RUG CHECKS</div>'+rows+'</div>';

  if(vw==="chart") showChart();
  else if(vw==="scanner") showScan();
  else showWhales();
}

function showChart(){
  vw="chart";
  document.getElementById("chartview").style.display="flex";
  document.getElementById("scanview").style.display="none";
  document.getElementById("whaleview").style.display="none";
  document.getElementById("chartbtn").classList.add("on");
  document.getElementById("scanbtn").classList.remove("on");
  document.getElementById("whalebtn").classList.remove("on");
}

function showScan(){
  if(!sel){alert("Select a token first!");return;}
  vw="scanner";
  document.getElementById("chartview").style.display="none";
  document.getElementById("scanview").style.display="block";
  document.getElementById("whaleview").style.display="none";
  document.getElementById("scanbtn").classList.add("on");
  document.getElementById("chartbtn").classList.remove("on");
  document.getElementById("whalebtn").classList.remove("on");
}

function showWhales(){
  vw="whales";
  document.getElementById("chartview").style.display="none";
  document.getElementById("scanview").style.display="none";
  document.getElementById("whaleview").style.display="block";
  document.getElementById("whalebtn").classList.add("on");
  document.getElementById("chartbtn").classList.remove("on");
  document.getElementById("scanbtn").classList.remove("on");
}

function setO(t){
  ot=t;
  var bb=document.getElementById("bb"),sb=document.getElementById("sb"),go=document.getElementById("gobtn");
  if(t==="buy"){
    bb.style.cssText="flex:1;padding:8px;border-radius:5px;border:none;font-size:12px;font-weight:900;cursor:pointer;text-transform:uppercase;background:#00e676;color:#000;font-family:'Courier New',monospace";
    sb.style.cssText="flex:1;padding:8px;border-radius:5px;border:none;font-size:12px;font-weight:900;cursor:pointer;text-transform:uppercase;background:transparent;color:#ffffff40;font-family:'Courier New',monospace";
    go.style.cssText="width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#00e676,#00b85e);color:#000;font-family:'Courier New',monospace";
    go.textContent="⚡ BUY NOW · Fee: 0.2%";
  }else{
    sb.style.cssText="flex:1;padding:8px;border-radius:5px;border:none;font-size:12px;font-weight:900;cursor:pointer;text-transform:uppercase;background:#ff1744;color:#fff;font-family:'Courier New',monospace";
    bb.style.cssText="flex:1;padding:8px;border-radius:5px;border:none;font-size:12px;font-weight:900;cursor:pointer;text-transform:uppercase;background:transparent;color:#ffffff40;font-family:'Courier New',monospace";
    go.style.cssText="width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#ff1744,#cc1036);color:#fff;font-family:'Courier New',monospace";
    go.textContent="💸 SELL NOW · Fee: 0.2%";
  }
}

function pickA(btn){
  document.querySelectorAll(".ab").forEach(function(b){b.classList.remove("on");});
  btn.classList.add("on");
}

function doT(){
  if(!sel){alert("Select a token first!");return;}
  var f=document.createElement("div");
  f.className="fl";
  f.style.cssText="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:999;font-size:32px;font-weight:900;animation:fo 1.5s forwards;background:"+(ot==="buy"?"#00e67620":"#ff174420")+";color:"+(ot==="buy"?"#00e676":"#ff1744");
  f.textContent=ot==="buy"?"⚡ BOUGHT!":"💸 SOLD!";
  document.body.appendChild(f);
  setTimeout(function(){if(f.parentNode)f.remove();},1500);
}

pick(T[0]);
</script>
</body>
</html>
