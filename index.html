<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>MemeIntel</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080c14;color:#e0e8f0;font-family:'Courier New',monospace;height:100vh;overflow:hidden}.nav{display:flex;align-items:center;background:#060a10;border-bottom:1px solid #ffffff0e;padding:0 10px;height:44px}.logo{color:#00e676;font-size:13px;font-weight:900}.tick{background:#00e67606;border-bottom:1px solid #00e67618;padding:4px;height:22px;overflow:hidden}.ti{display:inline-block;animation:tk 20s linear infinite;white-space:nowrap}@keyframes tk{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}.main{display:flex;height:calc(100vh - 66px)}.left{width:20%;background:#0a0f1a;border-right:1px solid #ffffff0e;overflow-y:auto;padding:8px}.tok{padding:8px;cursor:pointer;border-bottom:1px solid #ffffff06;border-radius:4px}.tok.sel{background:#00e67615;border-left:2px solid #00e676}.tok-score{font-size:10px;font-weight:900;margin-top:4px;padding:3px 6px;border-radius:3px;display:inline-block}.center{flex:1;background:#0c1120;border-right:1px solid #ffffff0e;display:flex;flex-direction:column;overflow:hidden}.tabs{display:flex;gap:2px;padding:6px;background:#060a10;border-bottom:1px solid #ffffff08}.tab{flex:1;padding:6px;border:1px solid #ffffff15;background:none;color:#ffffff50;font-size:9px;font-weight:700;cursor:pointer;border-radius:4px}.tab.on{background:#00e67615;color:#00e676;border-color:#00e67650}.view-area{flex:1;overflow-y:auto;padding:8px}.card{background:#0b1220;border:1px solid #ffffff08;border-radius:6px;padding:8px;margin-bottom:6px}.row{display:flex;justify-content:space-between;padding:4px 0;font-size:9px;border-bottom:1px solid #ffffff06}.chart{display:flex;align-items:flex-end;gap:1px;height:100%}.bar{flex:1;border-radius:1px;opacity:0.85}.right{width:20%;background:#0a0f1a;border-left:1px solid #ffffff0e;overflow-y:auto;padding:8px}.sec{border-bottom:1px solid #ffffff08;padding:8px 0}.sec-title{font-size:7px;color:#ffffff40;font-weight:700;letter-spacing:2px;margin-bottom:6px}.bs{display:flex;gap:2px;margin-bottom:6px}.bsbtn{flex:1;padding:6px;border:none;border-radius:3px;font-size:10px;font-weight:700;cursor:pointer}.gobtn{width:100%;padding:10px;border:none;border-radius:6px;font-size:11px;font-weight:900;cursor:pointer;margin-bottom:6px}.info{background:#0b1220;padding:6px;border-radius:4px;margin-bottom:4px;border:1px solid #ffffff08;font-size:9px}</style></head><body><div class="nav"><div class="logo">⚡ MEMEINTEL</div><div style="flex:1"></div><span style="color:#00e676;font-size:9px">● LIVE</span></div><div class="tick"><div class="ti" id="tk"></div></div><div class="main"><div class="left"><input id="search" placeholder="Search..." style="width:100%;padding:4px;background:#0b1220;border:1px solid #ffffff15;color:#fff;border-radius:4px;font-size:9px;margin-bottom:8px"><div id="toks"></div></div><div class="center"><div style="padding:8px;border-bottom:1px solid #ffffff0e;background:#060a10;font-size:9px" id="info">👆 Select token</div><div class="tabs"><button class="tab on" onclick="switchTab(0)">📊 Chart</button><button class="tab" onclick="switchTab(1)">🛡️ Scanner</button><button class="tab" onclick="switchTab(2)">🐋 Whales</button></div><div class="view-area"><div id="view0"></div><div id="view1" style="display:none"></div><div id="view2" style="display:none"></div></div></div><div class="right"><div class="sec"><div class="sec-title">Order</div><div class="bs"><button class="bsbtn" id="bb" onclick="setO('buy')" style="background:#00e676;color:#000">BUY</button><button class="bsbtn" id="sb" onclick="setO('sell')" style="background:transparent;color:#ffffff40">SELL</button></div><button class="gobtn" id="go" onclick="exec()" style="background:linear-gradient(135deg,#00e676,#00b85e);color:#000">⚡ BUY</button></div><div class="sec"><div class="sec-title">Community</div><div class="info"><span style="color:#ffffff40">Discord</span> <span id="disc" style="color:#00e676;float:right">12.5k</span></div><div class="info"><span style="color:#ffffff40">Twitter</span> <span id="twit" style="color:#00e676;float:right">8.3k</span></div><div class="info"><span style="color:#ffffff40">Hype</span> <span id="hype" style="color:#00e676;float:right">🔥 UP</span></div></div><div class="sec"><div class="sec-title">Whales</div><button onclick="alert('Modal coming soon!')" style="width:100%;padding:8px;background:#00e67615;border:1px solid #00e67650;color:#00e676;border-radius:4px;font-size:9px;font-weight:700;cursor:pointer">🐋 FOLLOW</button></div></div></div><script>const T=[{id:1,name:"PEPE2",icon:"🐸",price:0.000042,ch:182.4,d:12500,tw:4500,h:"🔥 UP",score:95,checks:[["Mint Auth","✅"],["Liq Lock","✅"],["Renounced","✅"],["Utility Lock","✅"],["Freeze","✅"],["Transfer Tax","✅"],["LP Burned","✅"],["Dev Lock","✅"]]},{id:2,name:"BONK2",icon:"🔨",price:0.00213,ch:34.2,d:8300,tw:2200,h:"STABLE",score:88,checks:[["Mint Auth","✅"],["Liq Lock","✅"],["Renounced","✅"],["Utility Lock","✅"],["Freeze","✅"],["Transfer Tax","⚠️"],["LP Burned","✅"],["Dev Lock","✅"]]},{id:3,name:"DOGWIF3",icon:"🐶",price:0.0081,ch:12.7,d:5200,tw:1100,h:"STABLE",score:62,checks:[["Mint Auth","⚠️"],["Liq Lock","✅"],["Renounced","⚠️"],["Utility Lock","✅"],["Freeze","⚠️"],["Transfer Tax","⚠️"],["LP Burned","✅"],["Dev Lock","⚠️"]]},{id:4,name:"MOON",icon:"🌙",price:0.00088,ch:44.1,d:7800,tw:1800,h:"🔥 UP",score:91,checks:[["Mint Auth","✅"],["Liq Lock","✅"],["Renounced","✅"],["Utility Lock","✅"],["Freeze","✅"],["Transfer Tax","✅"],["LP Burned","✅"],["Dev Lock","✅"]]},{id:5,name:"RUGBAIT",icon:"💀",price:0.00000091,ch:-62.1,d:230,tw:23,h:"DOWN",score:15,checks:[["Mint Auth","🚨"],["Liq Lock","🚨"],["Renounced","🚨"],["Utility Lock","🚨"],["Freeze","🚨"],["Transfer Tax","🚨"],["LP Burned","🚨"],["Dev Lock","🚨"]]}];function scoreColor(s){return s>=80?"#00e676":s>=60?"#ffab00":"#ff1744"}function fmt(p){return p<0.0001?p.toFixed(9):p.toFixed(4)}function fmt2(n){return n>1000?(n/1000).toFixed(1)+'k':n}let sel=null,ord="buy";const tl=document.getElementById("toks");T.forEach(t=>{const d=document.createElement("div");d.className="tok";d.id="t"+t.id;const ch=t.ch>0?'#00e676':'#ff1744';d.innerHTML=`<div style="font-size:16px;margin-bottom:2px">${t.icon}</div><div style="color:#fff;font-weight:700;font-size:10px">${t.name}</div><div style="color:${ch};font-size:8px;font-weight:700">${t.ch>0?'+':''}${t.ch}%</div><div class="tok-score" style="background:${scoreColor(t.score)}15;color:${scoreColor(t.score)}">🛡️ ${t.score}</div>`;d.onclick=()=>pick(t);tl.appendChild(d);});document.getElementById("tk").innerHTML=T.concat(T).map(t=>`<span style="margin-right:20px;color:${t.ch>0?'#00e676':'#ff1744'};font-weight:700">${t.icon} ${t.name}</span>`).join('');document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.toLowerCase();document.querySelectorAll(".tok").forEach(t=>{const n=t.textContent.toLowerCase();t.style.display=n.includes(q)?"block":"none";});});function pick(t){sel=t;document.querySelectorAll(".tok").forEach(x=>x.classList.remove("sel"));document.getElementById("t"+t.id).classList.add("sel");document.getElementById("info").textContent=`${t.icon} ${t.name} ${t.ch>0?'+':''}${t.ch}% $${fmt(t.price)}`;let html0="<div class='chart'>";for(let i=0;i<60;i++){const h=25+Math.sin(i*0.4+t.id*2)*25+Math.random()*20;const col=Math.random()>0.45?'#00e676':'#ff1744';html0+=`<div class='bar' style='background:${col};height:${h}%'></div>`;}html0+="</div>";document.getElementById("view0").innerHTML=html0;let html1="<div class='card' style='background:"+scoreColor(t.score)+"08;border:1px solid "+scoreColor(t.score)+"25'><div style='color:"+scoreColor(t.score)+";font-size:11px;font-weight:900;margin-bottom:8px'>SAFETY SCORE: "+t.score+"/100</div><div style='font-size:10px;color:#ffffff60'>"+(t.score>=80?"✅ SAFE":t.score>=60?"⚠️ MODERATE":"🚨 RISK")+"</div></div>";html1+="<div class='card'><div style='color:#38bdf8;font-size:8px;font-weight:700;margin-bottom:6px'>🛡️ SECURITY CHECKS</div>";for(let i=0;i<t.checks.length;i++){const ok=t.checks[i][1]==="✅";const col=ok?"#00e676":t.checks[i][1]==="⚠️"?"#ffab00":"#ff1744";html1+=`<div class='row'><span style='color:#ffffff45'>${t.checks[i][0]}</span><span style='color:${col};font-weight:700'>${t.checks[i][1]}</span></div>`;}html1+="</div>";document.getElementById("view1").innerHTML=html1;document.getElementById("view2").innerHTML="<div class='card' style='display:flex;gap:8px'><span style='font-size:16px'>🧠</span><div><div style='color:#00e676;font-weight:700;font-size:10px'>BUY $84,000</div><div style='color:#ffffff50;font-size:9px'>"+t.name+"</div></div></div>";document.getElementById("disc").textContent=fmt2(t.d);document.getElementById("twit").textContent=fmt2(t.tw);document.getElementById("hype").textContent=t.h;}function switchTab(i){for(let j=0;j<3;j++){document.getElementById("view"+j).style.display=j===i?"block":"none";document.querySelectorAll(".tab")[j].classList.toggle("on",j===i);}if(sel)pick(sel);}function setO(t){ord=t;if(t==="buy"){document.getElementById("bb").style.background="#00e676";document.getElementById("sb").style.background="transparent";document.getElementById("go").style.background="linear-gradient(135deg,#00e676,#00b85e)";document.getElementById("go").textContent="⚡ BUY";}else{document.getElementById("bb").style.background="transparent";document.getElementById("sb").style.background="#ff1744";document.getElementById("go").style.background="linear-gradient(135deg,#ff1744,#cc1036)";document.getElementById("go").textContent="💸 SELL";}}function exec(){alert("✅ "+ord.toUpperCase()+" executed!");}pick(T[0]);</script></body></html>
